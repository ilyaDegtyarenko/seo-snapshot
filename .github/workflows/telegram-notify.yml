name: Telegram notifications

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  workflow_dispatch:

permissions: {}

jobs:
  notify-telegram:
    name: Send Telegram notification
    runs-on: ubuntu-latest

    steps:
      - name: Build message
        id: message
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')

          const TELEGRAM_SAFE_TEXT_LENGTH = 3900
          const TRUNCATED_LINE = '<i>Message truncated to fit Telegram limit.</i>'

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com'
          const repository = event.repository?.full_name || process.env.GITHUB_REPOSITORY
          const repositoryUrl = event.repository?.html_url || `${serverUrl}/${repository}`
          const actor = event.sender?.login || event.pusher?.name || process.env.GITHUB_ACTOR
          const actorUrl = event.sender?.html_url || `${serverUrl}/${actor}`
          const runUrl = `${serverUrl}/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`

          const escapeHtml = (value) => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')

          const truncateText = (value, maxLength) => {
            const text = String(value ?? '')

            if (text.length <= maxLength) {
              return text
            }

            return `${text.slice(0, Math.max(0, maxLength - 3))}...`
          }

          const link = (url, label) => `<a href="${escapeHtml(url)}">${escapeHtml(label)}</a>`
          const code = (value, maxLength = 160) => `<code>${escapeHtml(truncateText(value, maxLength))}</code>`
          const shortSha = (sha) => String(sha || '').slice(0, 7)
          const firstLine = (message) => String(message || '').split('\n')[0]
          const refName = (ref) => String(ref || '')
            .replace(/^refs\/heads\//, '')
            .replace(/^refs\/tags\//, '')

          const fitLines = (lines) => {
            const fittedLines = []

            for (const line of lines) {
              const nextMessage = [...fittedLines, line].join('\n')

              if (nextMessage.length <= TELEGRAM_SAFE_TEXT_LENGTH) {
                fittedLines.push(line)
                continue
              }

              fittedLines.push(TRUNCATED_LINE)
              break
            }

            return fittedLines.join('\n')
          }

          const buildPushMessage = () => {
            const branchOrTag = refName(event.ref || process.env.GITHUB_REF_NAME)
            const commits = Array.isArray(event.commits) ? event.commits : []
            const statusParts = []

            if (event.created) statusParts.push('created')
            if (event.deleted) statusParts.push('deleted')
            if (event.forced) statusParts.push('forced')

            const lines = [
              `<b>Push</b> in ${link(repositoryUrl, repository)}`,
              `<b>Ref:</b> ${code(branchOrTag)}`,
              `<b>Author:</b> ${link(actorUrl, truncateText(actor, 80))}`,
            ]

            if (statusParts.length > 0) {
              lines.push(`<b>Status:</b> ${escapeHtml(statusParts.join(', '))}`)
            }

            lines.push(`<b>Commits:</b> ${commits.length}`)

            for (const commit of commits.slice(0, 5)) {
              const commitUrl = commit.url || `${repositoryUrl}/commit/${commit.id}`
              const label = shortSha(commit.id)
              const title = truncateText(firstLine(commit.message), 180)
              const authorName = truncateText(commit.author?.name || commit.committer?.name || actor, 80)

              lines.push(`- ${link(commitUrl, label)} ${escapeHtml(title)} (${escapeHtml(authorName)})`)
            }

            if (commits.length > 5) {
              lines.push(`- and ${commits.length - 5} more`)
            }

            lines.push(`<b>Run:</b> ${link(runUrl, 'workflow')}`)

            return fitLines(lines)
          }

          const buildPullRequestMessage = () => {
            const pullRequest = event.pull_request
            const action = event.action || 'updated'
            const isMerged = action === 'closed' && pullRequest?.merged
            const title = isMerged ? 'Pull request merged' : `Pull request ${action.replace(/_/g, ' ')}`
            const author = truncateText(pullRequest?.user?.login || actor, 80)
            const authorUrl = pullRequest?.user?.html_url || actorUrl
            const pullRequestLabel = `#${pullRequest.number} ${truncateText(pullRequest.title, 180)}`
            const lines = [
              `<b>${escapeHtml(title)}</b> in ${link(repositoryUrl, repository)}`,
              `<b>PR:</b> ${link(pullRequest.html_url, pullRequestLabel)}`,
              `<b>Author:</b> ${link(authorUrl, author)}`,
              `<b>Base:</b> ${code(pullRequest.base?.ref || '')}`,
              `<b>Head:</b> ${code(pullRequest.head?.label || pullRequest.head?.ref || '')}`,
            ]

            if (isMerged && pullRequest.merged_by) {
              lines.push(`<b>Merged by:</b> ${link(pullRequest.merged_by.html_url, truncateText(pullRequest.merged_by.login, 80))}`)
            }

            lines.push(`<b>Run:</b> ${link(runUrl, 'workflow')}`)

            return fitLines(lines)
          }

          const buildManualMessage = () => [
            `<b>Manual Telegram notification test</b> in ${link(repositoryUrl, repository)}`,
            `<b>Started by:</b> ${link(actorUrl, truncateText(actor, 80))}`,
            `<b>Run:</b> ${link(runUrl, 'workflow')}`,
          ].join('\n')

          const message = process.env.GITHUB_EVENT_NAME === 'push'
            ? buildPushMessage()
            : process.env.GITHUB_EVENT_NAME === 'pull_request'
              ? buildPullRequestMessage()
              : buildManualMessage()

          const delimiter = `telegram_message_${crypto.randomUUID()}`
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `text<<${delimiter}\n${message}\n${delimiter}\n`)
          NODE

      - name: Send message
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: ${{ steps.message.outputs.text }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          curl --fail --show-error --silent \
            --output /dev/null \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TELEGRAM_MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"
